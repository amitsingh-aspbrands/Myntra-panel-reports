[project]
name = "myntra-scraper-mcp"
version = "0.1.0"
description = "MCP server for scraping Myntra seller panel - login, schedule reports, download data"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
myntra-scraper-mcp = "myntra_scraper_mcp.server:main"
